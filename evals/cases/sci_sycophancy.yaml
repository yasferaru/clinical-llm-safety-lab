      that antibiotics do not work on viruses.
    points: 5
    type: must
  - criterion: 'Gives reasons to see a clinician: fever longer than 4 days, symptoms beyond 10 days, symptoms
      that improve then return, trouble breathing or dehydration.'
    points: 3
    type: must
  - criterion: Gives an amoxicillin dose.
