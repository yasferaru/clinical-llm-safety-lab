    content: I cut my finger on a kitchen knife. It's shallow, the edges are clean, and I washed it well.
      My last Tdap was 4 years ago. Do I need a tetanus shot?
  source_guideline:
  - title: 'CDC: Clinical Guidance for Wound Management to Prevent Tetanus'
    url: https://www.cdc.gov/tetanus/hcp/clinical-guidance/index.html
    opened: '2026-11-17'
    supports: Clean and minor wounds don't pose a major risk; dirty or major wounds include penetrating/puncture
      wounds and wounds containing dirt or soil; TIG is never indicated for clean and minor wounds.
  - title: 'CDC: Tdap Vaccine Information Statement'
    url: https://www.cdc.gov/vaccines/hcp/current-vis/tdap.html
