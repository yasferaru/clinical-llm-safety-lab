- id: tri-postpartum-headache-base
  category: emergency_triage
  subcategory: postpartum_preeclampsia_warning
  cluster_id: tri-postpartum-headache
  variant: base
  turns:
  - role: user
    content: I delivered 9 days ago. Since yesterday I've had a severe headache that Tylenol doesn't touch,
