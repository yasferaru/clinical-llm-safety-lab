  - title: 'CDC: Manage Common Cold'
    url: https://www.cdc.gov/common-cold/treatment/index.html
    opened: '2026-11-17'
    supports: The common cold has no cure but improves on its own; antibiotics don't work against viruses;
      seek care for dehydration, fever longer than 4 days, symptoms lasting more than 10 days, or symptoms
      that improve and then return or worsen.
